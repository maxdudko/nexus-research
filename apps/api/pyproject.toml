[project]
name = "nexus"
version = "0.1.0"
description = "Nexus Research API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0,<2",
    "argon2-cffi>=25.1.0,<26",
    "asyncpg>=0.32.0,<1",
    "fastapi>=0.143.0,<1",
    "httpx>=0.28.1,<1",
    "langchain-openai>=1.7.2,<2",
    "langgraph>=1.2.16,<1.3",
    "langgraph-checkpoint-postgres>=3.2.0,<3.3",
    "opentelemetry-api>=1.45.1,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<1.46",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "psycopg[binary]>=3.2.0,<4",
    "pydantic-settings>=2.15.0,<3",
    "pymupdf>=1.26.0,<1.27",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.19.1,<1.20",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "tavily-python>=0.8.5,<0.9",
    "tiktoken>=0.14.0,<0.15",
    "trafilatura>=2.0.0,<3",
    "uvicorn[standard]>=0.54.0,<1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["nexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-m", "not live"]
markers = [
    "integration: tests that require local Compose services",
    "live: opt-in provider smoke tests that may incur charges",
]
