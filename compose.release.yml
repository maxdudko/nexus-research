# Full private stack: Web, API, PostgreSQL, Qdrant and a one-shot schema init.
#
#   cp .env.release.example .env.release   # set POSTGRES_PASSWORD and provider keys
#   docker compose --env-file .env.release -f compose.release.yml up -d --build
#
# Only Web is published, on host loopback. API, PostgreSQL and Qdrant are reachable
# only from other containers. There is no authentication: do not expose port 3000
# publicly. Tested on linux/amd64 only.
#
# This file is standalone. `docker compose up -d` still starts the development
# data services from docker-compose.yml; the two projects do not share volumes.
#
# Image pins: refresh with `docker buildx imagetools inspect <image>:<tag>` and
# update tag and digest together.

name: nexus-release

x-database-url: &database-url "postgresql+asyncpg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.release}@postgres:5432/${POSTGRES_DB:-nexus}"

x-api-build: &api-build
  context: ./apps/api

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.release}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      # PostgreSQL 18 keeps PGDATA under this directory.
      - postgres_data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [data]
    healthcheck:
      # The image has bash but neither curl nor wget.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Domain migrations (Alembic) and LangGraph checkpoint tables have separate owners.
  # Both commands are idempotent; this service runs on every `up` and then exits.
  init:
    image: nexus-api:${NEXUS_VERSION:-0.1.0}
    build: *api-build
    restart: "no"
    command:
      - sh
      - -c
      - set -eu;
        alembic upgrade head;
        echo "init - domain schema at head";
        python -m nexus.research.checkpoint;
        echo "init - checkpoint tables ready"
    environment:
      NEXUS_ENVIRONMENT: production
      NEXUS_DATABASE_URL: *database-url
      NEXUS_QDRANT_URL: http://qdrant:6333
      NEXUS_SESSION_PEPPER: ${NEXUS_SESSION_PEPPER:?set NEXUS_SESSION_PEPPER in .env.release}
      NEXUS_TRUSTED_ORIGINS: http://127.0.0.1:${NEXUS_WEB_PORT:-3000}
      NEXUS_COOKIE_SECURE: "false"
      NEXUS_COOKIE_INSECURE_LOOPBACK: "true"
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: nexus-api:${NEXUS_VERSION:-0.1.0}
    build: *api-build
    restart: unless-stopped
    environment:
      NEXUS_ENVIRONMENT: production
      NEXUS_DATABASE_URL: *database-url
      NEXUS_QDRANT_URL: http://qdrant:6333
      NEXUS_SESSION_PEPPER: ${NEXUS_SESSION_PEPPER:?set NEXUS_SESSION_PEPPER in .env.release}
      NEXUS_TRUSTED_ORIGINS: http://127.0.0.1:${NEXUS_WEB_PORT:-3000}
      NEXUS_COOKIE_SECURE: "false"
      NEXUS_COOKIE_INSECURE_LOOPBACK: "true"
      # Values below come from .env.release. Unset names are not passed and the
      # API default applies.
      NEXUS_OPENAI_API_KEY:
      NEXUS_TAVILY_API_KEY:
      NEXUS_OPENAI_MODEL:
      NEXUS_OPENAI_EMBEDDING_MODEL:
      NEXUS_AI_TIMEOUT_SECONDS:
      NEXUS_AI_MAX_RETRIES:
      NEXUS_DISCOVERY_TIMEOUT_SECONDS:
      NEXUS_READINESS_TIMEOUT_SECONDS:
      NEXUS_PDF_MAX_BYTES:
      NEXUS_PDF_MAX_PAGES:
      NEXUS_GRAPH_MAX_ITERATIONS:
      NEXUS_GRAPH_MAX_SEARCH_CALLS:
      NEXUS_GRAPH_MAX_LLM_CALLS:
      NEXUS_GRAPH_MAX_WEB_PAGES:
      NEXUS_GRAPH_MAX_PASSAGES:
      NEXUS_GRAPH_DEADLINE_SECONDS:
      NEXUS_GRAPH_EXCERPT_CHARS:
      NEXUS_STREAM_HEARTBEAT_SECONDS:
      NEXUS_STREAM_MAX_CONCURRENT:
      NEXUS_STREAM_CANCEL_PERSIST_SECONDS:
      NEXUS_OTEL_ENABLED:
      NEXUS_OTEL_ENDPOINT:
      NEXUS_OTEL_SERVICE_NAME:
      NEXUS_OTEL_SAMPLE_RATIO:
      NEXUS_LOG_FORMAT:
      NEXUS_TAVILY_USD_PER_SEARCH:
    # `data` reaches PostgreSQL and Qdrant; `edge` serves Web and gives provider egress.
    networks: [data, edge]
    expose: ["8000"]
    stop_grace_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    image: nexus-web:${NEXUS_VERSION:-0.1.0}
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      # The host address is fixed to loopback on purpose; only the port is configurable.
      - "127.0.0.1:${NEXUS_WEB_PORT:-3000}:3000"
    networks: [edge]
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(4000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Optional. Start with `--profile observability` and set NEXUS_OTEL_ENABLED=true and
  # NEXUS_OTEL_ENDPOINT=http://jaeger:4318/v1/traces in .env.release.
  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--set"
      - "receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"
    networks: [edge]
    ports:
      - "127.0.0.1:16686:16686"

networks:
  # No egress and no published ports for the data services.
  data:
    internal: true
  edge: {}

volumes:
  postgres_data:
  qdrant_data:
