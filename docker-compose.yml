services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under this directory. Mounting
      # /var/lib/postgresql/data fails on this major version.
      - nexus_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - nexus_qdrant_data:/qdrant/storage

  # Optional trace UI. `docker compose up -d` does not start this profile.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"
    command:
      # The image listens on localhost until this is set, so the published
      # port would not accept traces from the host.
      - "--set"
      - "receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"

volumes:
  nexus_postgres_data:
  nexus_qdrant_data:
