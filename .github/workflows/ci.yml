name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          working-directory: apps/api

      - name: Start PostgreSQL and Qdrant
        run: docker compose up -d

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Ruff
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        working-directory: apps/api
        run: uv run mypy src

      - name: Wait for PostgreSQL and Qdrant
        run: |
          for _ in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -h 127.0.0.1 -U nexus -d nexus \
              && curl -fsS http://127.0.0.1:6333/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Create local env
        working-directory: apps/api
        run: cp .env.example .env

      - name: Pytest
        working-directory: apps/api
        run: uv run pytest

      - name: Offline evaluation
        working-directory: apps/api
        run: |
          uv run python -m nexus.evaluation --suite offline --output /tmp/nexus-eval-offline.json
          diff -u ../../docs/evaluation/baseline.json /tmp/nexus-eval-offline.json

      - name: Alembic upgrade
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic upgrade head

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build

  release:
    name: Release images and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          load: true
          tags: nexus-api:0.1.0
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          load: true
          tags: nexus-web:0.1.0
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Static release Compose checks
        run: python3 scripts/check_release_compose.py

      - name: Packaged smoke
        env:
          SMOKE_ARTIFACTS: ${{ runner.temp }}/nexus-smoke
        run: scripts/release-smoke.sh --no-build

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-logs
          path: ${{ runner.temp }}/nexus-smoke
          if-no-files-found: ignore
          retention-days: 7
